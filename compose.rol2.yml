services:
  postgres-rol2:
    image: postgres:17
    container_name: incidencias-rol2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: incidencias_rol2
      POSTGRES_USER: rol2_app
      POSTGRES_PASSWORD: ${ROL2_DB_PASSWORD:-rol2_dev_local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - incidencias_rol2_pgdata:/var/lib/postgresql/data
      - ./db/provisional/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rol2_app -d incidencias_rol2"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  incidencias_rol2_pgdata:
    name: incidencias_rol2_pgdata
