<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="icon" href="files/images/logo.png" type="image/png">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="container">
        <input type="checkbox" id="check">
        <div class="login form">
            <img src="files/images/logo.png" alt="Logo" class="logo">
            <header>Iniciar Sesión</header>
            <form action="#">
                <input type="text" placeholder="Ingresa tu carnet">
                <input type="password" placeholder="Ingresa tu contraseña">
                <a href="#">Olvidé mi contraseña</a>
                <input type="button" class="button" value="Confirmar">
            </form>
            <div class="signup">
                <span class="signup">¿Aún no tienes una cuenta?
                    <label for="check">Regístrate</label>
                </span>
            </div>
            <a href="index.html" class="guest">Continuar como invitado</a>
        </div>

        <div class="registration form">
            <img src="files/images/logo.png" alt="Logo" class="logo">
            <header>Regístrate</header>
            <form action="#">
                <input type="text" placeholder="Ingresa tu carnet">
                <input type="password" placeholder="Crea tu contraseña">
                <input type="password" placeholder="Confirma tu contraseña">
                <input type="button" class="button" value="Confirmar">
            </form>
            <div class="signup">
                <span class="signup">¿Ya tienes una cuenta?
                    <label for="check">Inicia Sesión</label>
                </span>
            </div>
        </div>
    </div>
        
</body>
</html>
