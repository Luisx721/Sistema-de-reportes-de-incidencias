services:
  postgres:
    image: postgres:17
    container_name: sistema-de-reportes-de-incidencias
    restart: always
    environment:
      POSTGRES_USER: reportes
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: midb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql-init:/docker-entrypoint-initdb.d
    ports:
      - "5440:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-incidencias
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5052:80"
    depends_on:
      - postgres

volumes:
  pgdata: